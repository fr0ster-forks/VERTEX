<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font:13px var(--vscode-font-family);color:var(--vscode-foreground);background:var(--vscode-sideBar-background);padding:14px}
h2{font-size:15px;margin:0 0 12px}fieldset{border:1px solid var(--vscode-panel-border);margin:10px 0;padding:10px}
legend{font-weight:600}label{display:block;margin:6px 0}button{margin:8px 8px 0 0;padding:5px 10px;color:var(--vscode-button-foreground);background:var(--vscode-button-background);border:0;cursor:pointer}
button:hover{background:var(--vscode-button-hoverBackground)}button:disabled{opacity:.55;cursor:default}
input{accent-color:var(--vscode-focusBorder)}.hint{color:var(--vscode-descriptionForeground);line-height:1.4}#status{margin-top:14px;white-space:pre-wrap}
table{width:100%;border-collapse:collapse;margin-top:8px}th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--vscode-panel-border);vertical-align:top;word-break:break-word}
th{color:var(--vscode-descriptionForeground)}h3{font-size:13px;margin:18px 0 6px}
</style></head><body>
<h2>Visual Debug</h2><div id="source"></div>
<div id="selection"></div>
<button id="debug">Run with ABAP Transpiler</button>
<p class="hint">Breakpoints, stepping and variables appear in the VS Code Debug view. VERTEX transpiles the ABAP source before each run.</p>
<div id="status" role="status"></div>
<section><h3>Variables at breakpoint</h3><div id="frame" class="hint">Waiting for a breakpoint.</div><table><thead><tr><th>Name</th><th>Value</th></tr></thead><tbody id="variables"></tbody></table></section>
<script>
const initial=/*INIT*/null/*INIT*/,host=acquireVsCodeApi();
document.getElementById('source').textContent=initial.name||'';
const selection=document.getElementById('selection');
for(const group of initial.scenarios||[]){
  const field=document.createElement('fieldset'),legend=document.createElement('legend');
  legend.textContent='Selection screen · '+group.group;field.appendChild(legend);
  for(const choice of group.choices){
    const label=document.createElement('label'),radio=document.createElement('input');
    radio.type='radio';radio.name='scenario-'+group.group;radio.value=choice.name;
    radio.checked=choice.name===(group.default||group.choices[0]?.name);
    label.append(radio,document.createTextNode(' '+choice.name));field.appendChild(label);
  }
  selection.appendChild(field);
}
const send=debug=>{
  const selected={};for(const group of initial.scenarios||[]){
    selected[group.group]=document.querySelector('input[name="scenario-'+group.group+'"]:checked')?.value||group.default;
  }
  document.getElementById('status').textContent='Transpiling…';
  document.getElementById('debug').disabled=true;
  host.postMessage({call:'localRun',debug,selection:selected});
};
document.getElementById('debug').onclick=()=>send(true);
window.addEventListener('message',event=>{const data=event.data;
  if(data?.type==='localVariables'){
    const state=data.state||{},body=document.getElementById('variables');body.replaceChildren();
    document.getElementById('frame').textContent=state.error||state.frame||'Running or finished.';
    for(const variable of state.variables||[]){const row=document.createElement('tr');
      for(const text of [variable.name,variable.value]){const cell=document.createElement('td');cell.textContent=String(text??'');row.appendChild(cell);}
      body.appendChild(row);
    }
    return;
  }
  if(data?.type!=='localRunResult')return;
  document.getElementById('debug').disabled=false;
  document.getElementById('status').textContent=data.error||data.message||'';
});
</script></body></html>
